name: Inbox latency
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Released tag or commit to compare with the selected ref
        required: true
        default: v0.6.0
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install xcodegen
      - name: Measure baseline
        env:
          BASELINE: ${{ inputs.baseline }}
        run: bash scripts/benchmarks/inbox-latency.sh "$BASELINE" baseline
      - name: Measure candidate on the same runner
        run: bash scripts/benchmarks/inbox-latency.sh "$GITHUB_SHA" candidate
      - name: Compare median end-to-end times
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, statistics
          from pathlib import Path
          def samples(build):
              lines = (Path(os.environ["RUNNER_TEMP"]) / f"mail-benchmark-{build}.log").read_text().splitlines()
              data = [dict(pair.split("=") for pair in line.split()[1:]) for line in lines if line.startswith("MAIL_LATENCY ")]
              assert len(data) == 6, f"Expected six measured launches, got {len(data)}"
              return {key: statistics.median(float(row[key]) for row in data) for key in ("inbox", "short", "long", "scroll")}
          before, after = samples("baseline"), samples("candidate")
          print("Median milliseconds across six launches per build. Includes UI automation and settling time.")
          print("\n| Operation | Baseline | Candidate |\n|---|---:|---:|")
          for key in before:
              print(f"| {key} | {before[key]:.1f} | {after[key]:.1f} |")
          PY
