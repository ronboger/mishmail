name: Inbox latency
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Released tag or commit to compare with the selected ref
        required: true
        default: v0.6.0
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install xcodegen
      - name: Measure baseline
        env:
          BASELINE: ${{ inputs.baseline }}
        run: bash scripts/benchmarks/inbox-latency.sh "$BASELINE" baseline
      - name: Measure candidate on the same runner
        run: bash scripts/benchmarks/inbox-latency.sh "$GITHUB_SHA" candidate
      - name: Repeat in reverse order using the same builds
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          bash scripts/benchmarks/inbox-latency.sh "$GITHUB_SHA" candidate repeat
          bash scripts/benchmarks/inbox-latency.sh "$BASELINE" baseline repeat
      - name: Compare median end-to-end times
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, statistics
          from pathlib import Path
          def samples(build, event):
              data = {}
              for block in ("first", "repeat"):
                  path = Path(os.environ["RUNNER_TEMP"]) / f"mail-benchmark-{build}-{block}.log"
                  for line in path.read_text().splitlines():
                      if line.startswith(event + " "):
                          for pair in line.split()[2:]:
                              key, value = pair.split("=")
                              data.setdefault(key, []).append(float(value))
              return data
          for event, title in [("MAIL_LATENCY", "UI action to verified result (includes XCTest overhead)"),
                               ("MAIL_NATIVE", "Native launch to inbox draw, click to body draw, wheel to clip movement")]:
              print(f"### {title}\n")
              before, after = samples("baseline", event), samples("candidate", event)
              print("| Operation | Baseline median (ms) | Candidate median (ms) | Samples |")
              print("|---|---:|---:|---:|")
              for key in ("inbox", "short", "long", "scroll"):
                  a, b = before.get(key, []), after.get(key, [])
                  if event == "MAIL_LATENCY":
                      assert len(a) == len(b) == 8, f"Missing end-to-end samples for {key}"
                  if a and b:
                      print(f"| {key} | {statistics.median(a):.1f} | {statistics.median(b):.1f} | {len(a)} / {len(b)} |")
              print()
          PY
