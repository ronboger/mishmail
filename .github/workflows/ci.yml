name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests & build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # Build first: the unit suite has tests that inspect the built Debug
      # app (signature, zip round trip, embedded relauncher, ad-hoc trust).
      # With no app on disk they skip, so the old order never ran them.
      - name: Build app
        run: make build

      - name: Run unit tests
        run: make test

  ui-test:
    name: UI smoke tests
    runs-on: macos-26
    # Separate job so a UI hang or desktop hijack cannot hide unit-test results.
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run UI smoke test
        run: make ui-test
