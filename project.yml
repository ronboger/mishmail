name: MishMail
options:
  bundleIdPrefix: dev.ronboger
  deploymentTarget:
    macOS: "14.0"
packages:
  GRDB:
    url: https://github.com/duckduckgo/GRDB.swift
    exactVersion: 3.0.0
targets:
  MishMail:
    type: application
    platform: macOS
    sources:
      - Sources/MishMail
      # The app↔relauncher contract (plan file paths and format); compiled
      # into both targets so the two sides can never skew.
      - Sources/MishMailRelauncher/Relaunch.swift
    dependencies:
      - package: GRDB
      # Embedded at Contents/Library/MishMailRelauncher.app and signed on copy.
      - target: MishMailRelauncher
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library
    # The app's entitlements are hand-maintained plists (the rationale for
    # each key lives as comments inside them), selected per build through
    # MISHMAIL_APP_ENTITLEMENTS below — NOT through an `entitlements:` block
    # here, because that block's generated CODE_SIGN_ENTITLEMENTS overrides
    # the variable-driven one in settings.
    #   Sources/MishMail/MishMail.entitlements               — dev default
    #   Sources/MishMail/MishMail.Distribution.entitlements  — install/release
    # Signing lives in Config/Signing.xcconfig (portable ad-hoc default; drop a
    # Config/Local.xcconfig to sign with your own team). Keep it out of the
    # per-target settings so the xcconfig actually wins.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # Which entitlements file signs the APP — routed through a variable so
        # the Makefile can switch install/release builds to the Distribution
        # entitlements without putting CODE_SIGN_ENTITLEMENTS on the xcodebuild
        # command line. A command-line setting applies to EVERY target, which
        # is how the relauncher shipped sandboxed in 0.4.3–0.4.5 and silently
        # lost the ability to strip quarantine (its whole job).
        MISHMAIL_APP_ENTITLEMENTS: Sources/MishMail/MishMail.entitlements
        CODE_SIGN_ENTITLEMENTS: $(MISHMAIL_APP_ENTITLEMENTS)
        MARKETING_VERSION: 0.4.17
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: true
        # Merged with generated keys: registers mailto: for default email app.
        INFOPLIST_FILE: Sources/MishMail/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: true
        # GRDB ships sqlite3.h next to its umbrella without listing it there;
        # clang emits -Wincomplete-umbrella for that. Harmless third-party
        # noise. The warning fires in the Clang importer during the *Swift*
        # compile, so it must be silenced via -Xcc — OTHER_CFLAGS alone
        # doesn't reach it.
        OTHER_CFLAGS: "$(inherited) -Wno-incomplete-umbrella"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-incomplete-umbrella"
      # Debug and Release build two DISTINCT apps so a throwaway test build is
      # never confused with — or able to corrupt — the real one you use daily:
      #   Release  → "MishMail",       dev.ronboger.MishMail        (make install → /Applications)
      #   Debug    → "MishMail Debug", dev.ronboger.MishMail.debug  (make run, launched in place)
      # The different bundle id gives Debug its own sandbox container + keychain,
      # so it syncs into a separate local database (sign in once; tokens persist
      # across rebuilds) and can't touch the real app's data. They coexist.
      configs:
        Debug:
          PRODUCT_NAME: MishMail Debug
          PRODUCT_BUNDLE_IDENTIFIER: dev.ronboger.MishMail.debug
          INFOPLIST_KEY_CFBundleDisplayName: MishMail Debug
        Release:
          PRODUCT_NAME: MishMail
          PRODUCT_BUNDLE_IDENTIFIER: dev.ronboger.MishMail
  # A second, deliberately tiny app whose whole job is to reopen MishMail after
  # it quits. It exists because a sandboxed app cannot restart itself: asking
  # LaunchServices for a second instance of the bundle you are running from
  # fails (-10810, seen updating 0.4.1 → 0.4.2), and the sandbox blocks
  # spawning a shell to do it instead (0.4.2 → 0.4.3). A separate bundle id
  # clears both — launching *another* app is permitted, and by the time this
  # one acts MishMail is gone, so there is nothing to conflict with.
  # LSUIElement: no Dock icon, no menu bar, nothing on screen.
  MishMailRelauncher:
    type: application
    platform: macOS
    sources: [Sources/MishMailRelauncher]
    # The same signing config as the app it lives inside — an embedded bundle
    # signed with a different certificate than its parent fails the build, and
    # this has to stay matched across all three tiers (ad-hoc default, free
    # Personal Team via Local.xcconfig, Developer ID).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # NOT the app's entitlements, and above all NOT sandboxed. The helper
        # must remove com.apple.quarantine from the installed update — the
        # sandbox denies that removal (EPERM), and a quarantined un-notarized
        # bundle won't launch at all (-10810). make install / make release
        # verify this after building; see the entitlements file itself for the
        # full story.
        CODE_SIGN_ENTITLEMENTS: Sources/MishMailRelauncher/MishMailRelauncher.entitlements
        PRODUCT_NAME: MishMailRelauncher
        PRODUCT_BUNDLE_IDENTIFIER: dev.ronboger.MishMail.Relauncher
        # No MARKETING_VERSION here on purpose: nothing reads the helper's
        # version, and a second one in this file is what the Makefile's
        # version lookup would trip over.
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
  # Standalone unit tests over the non-UI core (parsers, MIME, DB schema,
  # sync derivation). Compiles those sources directly — no app host, so no
  # keychain prompts, no network, no real database.
  MishMailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MishMailTests
      # The relauncher's quarantine stripping, testable here because the test
      # runner is unsandboxed — the same reason the strip lives in the helper.
      - Sources/MishMailRelauncher/Quarantine.swift
      - Sources/MishMailRelauncher/Relaunch.swift
      - Sources/MishMail/Gmail
      - Sources/MishMail/Store/Database.swift
      - Sources/MishMail/Store/SidebarCounts.swift
      - Sources/MishMail/Store/CategoryHide.swift
      - Sources/MishMail/Store/ThreadLabels.swift
      - Sources/MishMail/Support/AskMishContext.swift
      - Sources/MishMail/Support/AskMishLayout.swift
      - Sources/MishMail/Support/AskMishModelMenu.swift
      - Sources/MishMail/Support/AskMishTools.swift
      - Sources/MishMail/Support/AskMishTrace.swift
