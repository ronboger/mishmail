        GENERATE_INFOPLIST_FILE: true
        # Same GRDB incomplete-umbrella noise as the app target.
        OTHER_CFLAGS: "$(inherited) -Wno-incomplete-umbrella"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-incomplete-umbrella"
  MishMailUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/MishMailUITests]
    dependencies:
      - target: MishMail
    settings:
      base:
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: true
schemes:
  MishMail:
    build:
      targets:
        MishMail: all
    run:
      config: Debug
    archive:
      config: Release
  MishMailTests:
    build:
      targets:
        MishMailTests: [test]
    test:
      config: Debug
      targets:
        - MishMailTests
  MishMailUITests:
    build:
      targets:
        MishMail: all
        MishMailUITests: [test]
    test:
      config: Debug
      targets:
        - MishMailUITests
